<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>DroneStarTraining</title>
    <link rel="icon" href="TemplateData/favicons.png">
    <link rel="apple-touch-icon" href="TemplateData/favicons.png">
    <link rel="shortcut icon" href="TemplateData/favicons.png">
    <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body style="text-align: center; padding: 0; border: 0; margin: 0; background-color: black;">
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=960 height=540 style="width: 960px; height: 540px; background: #000000"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-add-logo"></div>
            <div id="unity-img-loading"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-logo-title-footer"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">DroneStarTraining</div>
        </div>
    </div>

    <script src="Build/Proj_DroneSim.loader.js"></script>

    <!-- CDNからSDKを追加 -->
    <!--<script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>-->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

    <!-- ページが読み込まれたら、必要なサービスのみを読み込む -->
    <!--<script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>-->
    <!--<script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>-->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- 初期設定 jsを読み込む-->
    <!--<script defer src="/__/firebase/init.js"></script>-->
    <!--<script>
        window.firebase = firebase; // グローバルスコープにFirebaseインスタンスを公開
    </script>-->

    <script>

        //キャッシュ削除
        indexedDB.deleteDatabase("UnityCache");

        var canvas = document.querySelector("#unity-canvas");

        var isMobile = false;

        //ウインドウサイズに合わせキャンバスサイズを変更
        function fitWindowCanvasSize() {

            var winHeight = window.innerHeight;
            const isViewUnderBar = true;  //falseにすると下部のバーが画面外に表示
            if (isViewUnderBar) {
                const barHeight = 0/*18 * 2*/;            //下部のバーサイズ
                const barHeightMargin = 8/*10 * 2*/;      //下部の追加余白サイズ
                winHeight = winHeight - barHeight - barHeightMargin;
            }
            const winWidth = window.innerWidth;
            const appWidth = 960/*"960"*/;
            const appHeight = 540/*"540"*/;
            const scale = Math.min((winWidth / appWidth), (winHeight / appHeight));
            const fixWidth = (appWidth * scale);
            const fixHeight = (appHeight * scale);

            canvas.style.width = fixWidth + 'px';
            canvas.style.height = fixHeight + 'px';
        }
        //ウインドウのリサイズ時の処理
        function windowResizeEvent() {
            var timeoutId = 0;
            const resizeDelay = 1;  //リサイズが完了したと判断する時間
            window.onresize = () => {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    //リサイズ終了時の処理
                    fitWindowCanvasSize();
                }, resizeDelay);
            };
        }

        // Shows a temporary message banner/ribbon for a few seconds, or
        // a permanent error message on top of the canvas if type=='error'.
        // If type=='warning', a yellow highlight color is used.
        // Modify or remove this function to customize the visually presented
        // way that non-critical warnings and error messages are presented to the
        // user.
        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function () {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Proj_DroneSim.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Proj_DroneSim.data.unityweb",
        frameworkUrl: buildUrl + "/Proj_DroneSim.framework.js.unityweb",
        codeUrl: buildUrl + "/Proj_DroneSim.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ORSO Inc.",
        productName: "DroneStarTraining",
        productVersion: "0.0.2",
        showBanner: unityShowBanner,
      };


        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:

            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";

            isMobile = true;
        }
        else {

            fitWindowCanvasSize();
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                    document.makeFullscreen('unity-container');
                };
            }).catch((message) => {
                alert(message);
            });
            if (!isMobile) windowResizeEvent();
        };

        document.body.appendChild(script);

    </script>
</body>
</html>
